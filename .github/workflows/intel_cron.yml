name: Agent Intelligence Wire Cron

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Feeds and Rebuild Endpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        run: |
          python main.py

      - name: Commit and push updates
        run: |
          git config user.name "intel-wire-bot[bot]"
          git config user.email "intel-wire-bot@users.noreply.github.com"
          git add -A data/ llms.txt
          
          if git diff --staged --quiet; then
            echo "No changes detected across any feeds. Skipping commit."
          else
            git commit -m "chore(intel): refresh sdk diff and model economy endpoints [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
